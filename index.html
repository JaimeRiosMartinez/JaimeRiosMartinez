<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conoce a Calcetines, un gato muy simpático, y descubre sus curiosidades.">
  <title>Calcetines, el gato curioso</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #292638;
      background: #fff8ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --morado: #654c91;
      --coral: #ed876f;
      --tinta-suave: #625d70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      line-height: 1.55;
    }

    main {
      width: min(100% - 2rem, 1000px);
      margin: 0 auto;
      padding: 3rem 0;
    }

    header {
      text-align: center;
    }

    .etiqueta {
      margin: 0 0 0.4rem;
      color: var(--morado);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--morado);
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 1.05;
    }

    .intro {
      max-width: 560px;
      margin: 0.8rem auto 0;
      color: var(--tinta-suave);
      font-size: 1.08rem;
    }

    .gato {
      display: block;
      width: min(100%, 290px);
      height: auto;
      margin: 1rem auto 0;
    }

    h2 {
      margin: 0 0 1rem;
      text-align: center;
      font-size: 1.45rem;
    }

    .curiosidades {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .casilla {
      min-height: 125px;
      padding: 1rem;
      border: 2px solid #eadff5;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .casilla:hover,
    .casilla:focus-visible,
    .casilla[aria-pressed="true"] {
      transform: translateY(-3px);
      border-color: var(--coral);
      box-shadow: 0 7px 18px rgb(65 45 85 / 10%);
    }

    .casilla:focus-visible {
      outline: 3px solid var(--morado);
      outline-offset: 3px;
    }

    .icono {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 1.7rem;
    }

    .casilla strong {
      display: block;
      color: var(--morado);
      font-size: 1.05rem;
    }

    .detalle {
      min-height: 92px;
      margin-top: 1rem;
      padding: 1.1rem 1.25rem;
      border-radius: 16px;
      background: #f0e9f8;
      text-align: center;
    }

    .detalle p {
      margin: 0;
    }

    .detalle strong {
      color: var(--morado);
    }

    footer {
      margin-top: 1.5rem;
      color: var(--tinta-suave);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 620px) {
      main {
        padding: 2rem 0;
      }

      .curiosidades {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .casilla {
        min-height: 115px;
        padding: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="etiqueta">Conoce a nuestro amigo</p>
      <h1>Calcetines</h1>
      <p class="intro">¡Miau! Soy Calcetines. Pasa el cursor por las casillas (o selecciónalas con el teclado) para descubrir cosas sobre mí.</p>
      <svg class="gato" viewBox="0 0 300 260" role="img" aria-labelledby="titulo-gato descripcion-gato">
        <title id="titulo-gato">Dibujo de Calcetines</title>
        <desc id="descripcion-gato">Un gato gris sentado, con orejas puntiagudas, cola curva y patitas blancas como calcetines.</desc>
        <ellipse cx="150" cy="238" rx="104" ry="13" fill="#e8d9ca"/>
        <path d="M210 194c54 8 57-42 28-57-13-7-25 1-22 12 3 8 13 8 17 3" fill="none" stroke="#555468" stroke-width="17" stroke-linecap="round"/>
        <path d="M89 83 75 27l52 33M211 83l14-56-52 33" fill="#747387" stroke="#555468" stroke-width="7" stroke-linejoin="round"/>
        <path d="m91 67-6-26 25 16m95 10 7-26-25 16" fill="#efa09a"/>
        <path d="M76 119c0-49 33-78 74-78s74 29 74 78v51c0 34-27 58-74 58s-74-24-74-58z" fill="#858497" stroke="#555468" stroke-width="7"/>
        <path d="M94 205c10-10 24-9 34 2v19H91c-6-7-4-15 3-21zm78 2c10-11 24-12 34-2 7 6 9 14 3 21h-37z" fill="#fff8ef"/>
        <path d="M104 117c0-13 9-22 20-22s20 9 20 22-9 17-20 17-20-4-20-17zm52 0c0-13 9-22 20-22s20 9 20 22-9 17-20 17-20-4-20-17z" fill="#fff"/>
        <ellipse cx="124" cy="115" rx="5" ry="9" fill="#292638"/>
        <ellipse cx="176" cy="115" rx="5" ry="9" fill="#292638"/>
        <path d="m144 139 6-5 6 5-6 6z" fill="#ed876f"/>
        <path d="M150 145c-2 9-12 10-17 5m17-5c2 9 12 10 17 5" fill="none" stroke="#555468" stroke-width="3" stroke-linecap="round"/>
        <path d="m106 143-31-5m32 15-32 2m119-12 31-5m-32 15 32 2" fill="none" stroke="#555468" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M116 45c7 12 10 23 9 34m30-37c-4 14-4 25 0 36m29-29c-8 11-11 22-10 34" fill="none" stroke="#666577" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </header>

    <section aria-labelledby="titulo-curiosidades">
      <h2 id="titulo-curiosidades">Seis curiosidades sobre mí</h2>
      <div class="curiosidades">
        <button class="casilla" type="button" data-titulo="¡Soy muy comilón!" data-detalle="Me encanta la hora de comer. Si oigo abrir una lata, aparezco en la cocina en un segundo.">
          <span class="icono" aria-hidden="true">🍽️</span>
          <strong>Un gran apetito</strong>
        </button>
        <button class="casilla" type="button" data-titulo="¡La siesta es mi especialidad!" data-detalle="Duermo muchas horas al día y siempre encuentro un rincón calentito para echar una cabezadita.">
          <span class="icono" aria-hidden="true">💤</span>
          <strong>Muy dormilón</strong>
        </button>
        <button class="casilla" type="button" data-titulo="¡Todo me da curiosidad!" data-detalle="Me gusta investigar cada caja, bolsa y objeto nuevo que aparece en casa.">
          <span class="icono" aria-hidden="true">🔎</span>
          <strong>Muy curioso</strong>
        </button>
        <button class="casilla" type="button" data-titulo="¡Las cajas son mis castillos!" data-detalle="Aunque tenga una cama estupenda, una caja de cartón suele ser mi lugar favorito para esconderme.">
          <span class="icono" aria-hidden="true">📦</span>
          <strong>Fan de las cajas</strong>
        </button>
        <button class="casilla" type="button" data-titulo="¡Ronroneo cuando estoy a gusto!" data-detalle="Cuando me acarician con cariño, mi ronroneo suave llena la habitación.">
          <span class="icono" aria-hidden="true">💜</span>
          <strong>Un ronroneo feliz</strong>
        </button>
        <button class="casilla" type="button" data-titulo="¡Mis patitas parecen calcetines!" data-detalle="Tengo las puntas de las patas claritas, como si llevara puestos unos calcetines suaves.">
          <span class="icono" aria-hidden="true">🧦</span>
          <strong>¿Por qué Calcetines?</strong>
        </button>
      </div>
      <div class="detalle" id="detalle" role="status" aria-live="polite" aria-atomic="true">
        <p>Elige una casilla para descubrir una curiosidad de Calcetines.</p>
      </div>
    </section>

    <footer>¡Gracias por conocerme! 🐾</footer>
  </main>
  <script>
    "use strict";

    const casillas = document.querySelectorAll(".casilla");
    const detalle = document.getElementById("detalle");

    function mostrarCuriosidad(casilla) {
      for (const otraCasilla of casillas) {
        otraCasilla.setAttribute("aria-pressed", String(otraCasilla === casilla));
      }

      const titulo = document.createElement("strong");
      titulo.textContent = casilla.dataset.titulo;
      const texto = document.createElement("p");
      texto.textContent = casilla.dataset.detalle;
      detalle.replaceChildren(titulo, texto);
    }

    for (const casilla of casillas) {
      casilla.addEventListener("pointerenter", () => mostrarCuriosidad(casilla));
      casilla.addEventListener("focus", () => mostrarCuriosidad(casilla));
      casilla.addEventListener("click", () => mostrarCuriosidad(casilla));
    }
  </script>
</body>
</html>
